services:

  # ─── Infraestrutura ───────────────────────────────────────────────────────────

  postgres-pizzaria:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pizzaria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_pizzaria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-estoque:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_estoque_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Microserviços de suporte ─────────────────────────────────────────────────

  name-server:
    build: ./microservicos/name-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  gateway:
    build: ./microservicos/gateway
    ports:
      - "8765:8765"
    environment:
      EUREKA_URI: http://name-server:8761/eureka/
      JWT_SECRET: 357638792F423F4428472B4B6250655368566D597133743677397A2443264629
    depends_on:
      name-server:
        condition: service_started

  # ─── Serviços de domínio ──────────────────────────────────────────────────────

  pizzaria:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-pizzaria:5432/pizzaria_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      ESTOQUE_SERVICE_URL: http://estoque-service:8001
      EUREKA_URI: http://name-server:8761/eureka/
    depends_on:
      postgres-pizzaria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      estoque-service:
        condition: service_started
      name-server:
        condition: service_started

  estoque-service:
    build: ./microservicos/estoque-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-estoque:5432/estoque_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_URI: http://name-server:8761/eureka/
    depends_on:
      postgres-estoque:
        condition: service_healthy
      name-server:
        condition: service_started

  entrega-service:
    build: ./microservicos/entrega-service
    environment:
      RABBITMQ_HOST: rabbitmq
      PIZZARIA_URL: http://pizzaria:8080
      EUREKA_URI: http://name-server:8761/eureka/
    depends_on:
      rabbitmq:
        condition: service_healthy
      name-server:
        condition: service_started

volumes:
  postgres_pizzaria_data:
  postgres_estoque_data:
