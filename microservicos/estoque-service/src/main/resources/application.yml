server:
  port: 8001

spring:
  application:
    name: estoque-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/estoque_db}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://name-server:8761/eureka/}
  instance:
    prefer-ip-address: true
